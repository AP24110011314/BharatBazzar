<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#144c2d"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c25e2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Apple style squircle background -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Artisan Terracotta Pot silhouette -->
  <path d="M22 29 C20 40, 24 49, 32 49 C40 49, 44 40, 42 29 Z" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="32" cy="28.5" rx="10.5" ry="3.5" fill="#ffffff"/>
  <ellipse cx="32" cy="28.5" rx="7.5" ry="2" fill="#2d6a4f" opacity="0.3"/>
  <!-- Golden Artisan Leaf -->
  <path d="M32 15 C39 19, 37 25, 32 27 C27 25, 25 19, 32 15 Z" fill="url(#leafGrad)"/>
</svg>

